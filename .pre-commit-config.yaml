default_language_version:
  python: python3

exclude: |
  (?x)^(
    data/|
    docs/|
    frontend/|
    infra/|
    venv/|
    env/|
    __pycache__/|
    .*?/migrations/
  )

repos:
  # ------------------------------------------------------------
  # Базовые "гигиенические" хуки
  # ------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files

  # ------------------------------------------------------------
  # Ruff = линтер + форматтер + сортировка импортов
  # ------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      # Линт + автофиксы (включая импорты)
      - id: ruff
        args:
          - --fix
          - --exit-non-zero-on-fix
          - --config
          - pyproject.toml

      # Форматирование (замена Black)
      - id: ruff-format

  # ------------------------------------------------------------
  # Django-upgrade
  # ------------------------------------------------------------
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.21.0
    hooks:
      - id: django-upgrade
        args: [--target-version, "4.2"]

  # ------------------------------------------------------------
  # Pytest (ручной запуск)
  # ------------------------------------------------------------
  - repo: local
    hooks:
      - id: pytest
        name: pytest (manual)
        entry: poetry run pytest
        language: system
        pass_filenames: false
        stages: [manual]
