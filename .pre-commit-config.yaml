default_language_version:
  python: python3

exclude: |
  (?x)^(
    data/|
    docs/|
    frontend/|
    infra/|
    venv/|
    env/|
    __pycache__/|
    .*?/migrations/
  )

repos:
  # ------------------------------------------------------------
  # Базовые "гигиенические" хуки
  # ------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files

  # ------------------------------------------------------------
  # Ruff: линт + автофиксы (БЕЗ импортов)
  # ------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args:
          - --fix
          - --exit-non-zero-on-fix
          - --config
          - pyproject.toml

  # ------------------------------------------------------------
  # isort: ЕДИНСТВЕННЫЙ, кто сортирует импорты
  # ------------------------------------------------------------
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args:
          - --profile=black
          - --settings-path=pyproject.toml

  # ------------------------------------------------------------
  # Black: финальное форматирование
  # ------------------------------------------------------------
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        args:
          - --config
          - pyproject.toml

  # ------------------------------------------------------------
  # Django-upgrade
  # ------------------------------------------------------------
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.21.0
    hooks:
      - id: django-upgrade
        args: [--target-version, "4.2"]
