services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${REGISTRY_URL:-local}/planner-backend:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/backend/Dockerfile
    command:
      [
        "/app/backend/entrypoint.sh",
        "gunicorn",
        "config.wsgi:application",
        "--bind",
        "0.0.0.0:8000",
        "--workers",
        "3",
        "--timeout",
        "60"
      ]
    env_file:
      - ../../backend/.env.example
    environment:
      DEBUG: "0"
      DATABASE_URL: postgres://planner:planner@db:5432/planner
    volumes:
      - static_data:/app/backend/staticfiles
      - media_data:/app/backend/media
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: ${REGISTRY_URL:-local}/planner-nginx:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/nginx/Dockerfile
    ports:
      - "80:80"
    volumes:
      - ../docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/static
      - media_data:/media
    depends_on:
      - backend

volumes:
  postgres_data:
  static_data:
  media_data:
