services:
  db:
    image: postgres:16-alpine
    container_name: planner_db_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planner_db}
      POSTGRES_USER: ${POSTGRES_USER:-planner_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planner_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planner_user} -d ${POSTGRES_DB:-planner_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - planner_network

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend/Dockerfile
    container_name: planner_backend_prod
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 60 --access-logfile - --error-logfile -
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    expose:
      - "8000"
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-planner_user}:${POSTGRES_PASSWORD:-planner_pass}@db:5432/${POSTGRES_DB:-planner_db}
      - DEBUG=0
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - planner_network

  nginx:
    build:
      context: ../docker/nginx
      dockerfile: Dockerfile
    container_name: planner_nginx_prod
    ports:
      - "80:80"
    volumes:
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - planner_network

volumes:
  postgres_data:
  media_data:
  static_data:

networks:
  planner_network:
    driver: bridge
