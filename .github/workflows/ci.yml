name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: planner_test
          POSTGRES_USER: planner_user
          POSTGRES_PASSWORD: planner_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.8.0
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v3
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root

    # - name: Lint with Ruff
    #   run: |
    #     poetry run ruff check backend/
    #     poetry run ruff format --check backend/

    - name: Check migrations
      env:
        DATABASE_URL: postgres://planner_user:planner_pass@localhost:5432/planner_test
        SECRET_KEY: test-secret-key-for-ci
      run: |
        cd backend
        poetry run python manage.py makemigrations --check --dry-run --no-input

    - name: Run tests
      env:
        DATABASE_URL: postgres://planner_user:planner_pass@localhost:5432/planner_test
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: 1
      run: |
        cd backend
        poetry run pytest --cov=planner --cov-report=term-missing --cov-report=xml

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: unittests
        name: codecov-umbrella
