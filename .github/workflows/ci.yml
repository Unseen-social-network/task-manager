name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: planner_test
          POSTGRES_USER: planner_user
          POSTGRES_PASSWORD: planner_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://planner_user:planner_pass@localhost:5432/planner_test
      DJANGO_SETTINGS_MODULE: app.settings
      SECRET_KEY: test
      DEBUG: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.0
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry venv
        uses: actions/cache@v4
        with:
         path: .venv
         key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Ruff lint
        run: poetry run ruff check backend/ --config pyproject.toml

      - name: Ruff format check
        run: poetry run ruff format --check backend/

      - name: Check migrations
        env:
          DATABASE_URL: postgres://planner_user:planner_pass@localhost:5432/planner_test
          SECRET_KEY: test-secret-key-for-ci
        run: |
          cd backend
          poetry run python manage.py makemigrations --check --dry-run --no-input

      - name: Run backend tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "1"
          USE_SQLITE_FOR_TESTS: "true"
        run: |
            cd backend
            poetry run pytest \
              --cov=planner \
              --cov-report=term-missing \
              --cov-report=xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: unittests
          name: codecov

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
