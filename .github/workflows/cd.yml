name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: task_manager_backend
  IMAGE_NAME_FRONTEND: task_manager_frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
          ref: ${{ github.event.workflow_run.head_sha }}

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container

    - name: Extract metadata for Backend
      id: meta-backend
      uses: docker/metadata-action@v5
      with:
        images: fgeeha/${{ env.IMAGE_NAME_BACKEND }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-

    - name: Build and push Backend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./infra/docker/backend/Dockerfile
        push: true
        tags: ${{ steps.meta-backend.outputs.tags }}
        labels: ${{ steps.meta-backend.outputs.labels }}

    - name: Extract metadata for frontend
      id: meta-frontend
      uses: docker/metadata-action@v5
      with:
        images: fgeeha/${{ env.IMAGE_NAME_FRONTEND }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code for deploy
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Проверить структуру репозитория
      run: |
        echo "=== Структура репозитория ==="
        echo "Текущая директория: $(pwd)"
        echo ""
        echo "Содержимое корневой директории:"
        ls -la
        echo ""
        echo "Поиск docker-compose файлов:"
        find . -name "*docker-compose*" -type f
        echo ""
        echo "Поиск Makefile:"
        find . -name "Makefile" -type f
        echo ""
        echo "Директория infra:"
        ls -la infra/ 2>/dev/null || echo "Директория infra не найдена"
        echo ""
        echo "Директория infra/compose:"
        ls -la infra/compose/ 2>/dev/null || echo "Директория infra/compose не найдена"

    - name: Найти или создать необходимые файлы
      run: |
            echo "=== Подготовка файлов для деплоя ==="
            
            # 1. Найти docker-compose.production.yml
            if [ -f "docker-compose.production.yml" ]; then
              echo "✓ Найден docker-compose.production.yml в корне"
            elif [ -f "infra/compose/docker-compose.prod.yml" ]; then
              echo "✓ Найден infra/compose/docker-compose.prod.yml, копируем..."
              cp infra/compose/docker-compose.prod.yml docker-compose.production.yml
            else
              echo "⚠ Docker-compose файл не найден. Создаем базовый..."
              # Создаем базовый docker-compose файл
              cat > docker-compose.production.yml << 'EOF'
services:
  db:
    image: postgres:16-alpine
    container_name: planner_db_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planner_db}
      POSTGRES_USER: ${POSTGRES_USER:-planner_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planner_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planner_user} -d ${POSTGRES_DB:-planner_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - planner_network

  backend:
    image: fgeeha/task_manager_backend:${IMAGE_TAG:-latest}
    env_file: .env
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-planner_user}:${POSTGRES_PASSWORD:-planner_pass}@db:5432/${POSTGRES_DB:-planner_db}
      - DEBUG=0
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - planner_network

  nginx:
    image: fgeeha/task_manager_frontend:${IMAGE_TAG:-latest}
    ports:
      - "3003:80"
    volumes:
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - planner_network

volumes:
  postgres_data:
  media_data:
  static_data:

networks:
  planner_network:
    driver: bridge
    EOF
            fi
            
            # 2. Проверить или создать Makefile
            if [ -f "Makefile" ]; then
              echo "✓ Найден Makefile"
            else
              echo "⚠ Makefile не найден. Создаем..."
              cat > Makefile << 'EOF'

.PHONY: help build up down restart logs shell migrate makemigrations createsuperuser test lint format clean

# Default target
help:
	@echo "Available commands:"
	@echo "  make build           - Build Docker images"
	@echo "  make up              - Start development environment"
	@echo "  make down            - Stop development environment"
	@echo "  make restart         - Restart services"
	@echo "  make logs            - View logs"
	@echo "  make shell           - Open Django shell"
	@echo "  make bash            - Open bash in backend container"
	@echo "  make migrate         - Run database migrations"
	@echo "  make makemigrations  - Create new migrations"
	@echo "  make createsuperuser - Create superuser"
	@echo "  make test            - Run tests"
	@echo "  make lint            - Run linters"
	@echo "  make format          - Format code"
	@echo "  make clean           - Clean up containers and volumes"
	@echo ""
	@echo "Production commands:"
	@echo "  make prod-build      - Build production images"
	@echo "  make prod-up         - Start production environment"
	@echo "  make prod-down       - Stop production environment"
	@echo "  make prod-logs       - View production logs"

# Development commands
build:
	DOCKER_BUILDKIT=1 docker compose -f infra/compose/docker-compose.yml build

build-no-cache:
	DOCKER_BUILDKIT=1 docker compose -f infra/compose/docker-compose.yml build --no-cache

up:
	DOCKER_BUILDKIT=1 docker compose -f infra/compose/docker-compose.yml up -d
	@echo "Waiting for database..."
	@sleep 5
	docker compose -f infra/compose/docker-compose.yml exec backend python manage.py migrate
	docker compose -f infra/compose/docker-compose.yml exec backend python manage.py collectstatic --noinput
	@echo "\nDevelopment environment is ready!"
	@echo "Backend: http://localhost:8000"
	@echo "Admin: http://localhost:8000/admin"
	@echo "API Docs: http://localhost:8000/api/schema/swagger-ui/"

down:
	docker compose -f infra/compose/docker-compose.yml down

restart:
	docker compose -f infra/compose/docker-compose.yml restart

logs:
	docker compose -f infra/compose/docker-compose.yml logs -f

shell:
	docker compose -f infra/compose/docker-compose.yml exec backend python manage.py shell

bash:
	docker compose -f infra/compose/docker-compose.yml exec backend bash

migrate:
	docker compose -f infra/compose/docker-compose.yml exec backend python manage.py migrate

makemigrations:
	docker compose -f infra/compose/docker-compose.yml exec backend python manage.py makemigrations

createsuperuser:
	docker compose -f infra/compose/docker-compose.yml exec backend python manage.py createsuperuser

# Testing and linting
test:
	docker compose -f infra/compose/docker-compose.yml exec backend pytest -v

test-cov:
	docker compose -f infra/compose/docker-compose.yml exec backend pytest --cov=planner --cov-report=html

lint:
	poetry run ruff check backend/
	poetry run ruff format --check backend/

format:
	poetry run ruff check --fix backend/
	poetry run ruff format backend/

# Production commands
prod-build:
	docker compose -f infra/compose/docker-compose.prod.yml build

prod-up:
	docker compose -f infra/compose/docker-compose.prod.yml up -d
	@echo "Waiting for database..."
	@sleep 5
	docker compose -f infra/compose/docker-compose.prod.yml exec backend python manage.py migrate
	docker compose -f infra/compose/docker-compose.prod.yml exec backend python manage.py collectstatic --no-input
	@echo "\nProduction environment is ready!"
	@echo "Application: http://localhost"

prod-down:
	docker compose -f infra/compose/docker-compose.prod.yml down

prod-logs:
	docker compose -f infra/compose/docker-compose.prod.yml logs -f

# Cleanup
clean:
	docker compose -f infra/compose/docker-compose.yml down -v
	docker compose -f infra/compose/docker-compose.prod.yml down -v
	find . -type d -name __pycache__ -exec rm -rf {} +
	find . -type f -name "*.pyc" -delete
	find . -type d -name "*.egg-info" -exec rm -rf {} +
	find . -type d -name ".pytest_cache" -exec rm -rf {} +
	find . -type d -name ".ruff_cache" -exec rm -rf {} +

    EOF
            fi
            
            # 3. Проверить созданные файлы
            echo ""
            echo "=== Итоговые файлы ==="
            echo "Размер docker-compose.production.yml: $(wc -l < docker-compose.production.yml) строк"
            echo "Размер Makefile: $(wc -l < Makefile) строк"
            ls -la docker-compose.production.yml Makefile

    - name: Копировать файлы на сервер
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
        port: ${{ secrets.SSH_PORT || '22' }}
        source: "docker-compose.production.yml,Makefile"
        target: "${{ secrets.PROJECT_PATH || '/opt/planner' }}"
        overwrite: true
        debug: true
    
    - name: Развернуть на сервере
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
        port: ${{ secrets.SSH_PORT || '22' }}
        script: |
          echo "=== Начало деплоя на сервере ==="
          echo "Текущая директория: $(pwd)"
          echo "Целевая директория: ${{ secrets.PROJECT_PATH || '/opt/planner' }}"
          
          cd "${{ secrets.PROJECT_PATH || '/opt/planner' }}"
          echo "Перешли в директорию: $(pwd)"
          
          echo "Содержимое директории:"
          ls -la
          
          echo "Проверяем наличие docker-compose.production.yml:"
          if [ -f "docker-compose.production.yml" ]; then
            echo "✓ docker-compose.production.yml найден"
            echo "Первые 5 строк файла:"
            head -5 docker-compose.production.yml
          else
            echo "✗ docker-compose.production.yml не найден!"
            exit 1
          fi
          
          echo "Проверяем наличие Makefile:"
          if [ -f "Makefile" ]; then
            echo "✓ Makefile найден"
          else
            echo "✗ Makefile не найден!"
            exit 1
          fi
          
          echo "Останавливаем старые контейнеры..."
          docker compose -f docker-compose.production.yml down || true
          
          echo "Пуллим новые образы..."
          docker compose -f docker-compose.production.yml pull
          
          echo "Запускаем контейнеры..."
          docker compose -f docker-compose.production.yml up -d
          
          echo "Ждем запуска backend..."
          sleep 10
          
          echo "Выполняем миграции..."
          docker compose -f docker-compose.production.yml exec -T backend python manage.py migrate --no-input || echo "Миграции не выполнены"
          
          echo "Собираем статические файлы..."
          docker compose -f docker-compose.production.yml exec -T backend python manage.py collectstatic --no-input --clear || echo "Сборка статики не выполнена"
          
          echo "Очищаем неиспользуемые Docker объекты..."
          docker system prune -af
          
          echo "Проверяем работу контейнеров..."
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          
          echo "=== Деплой завершен успешно ==="

  send_message:
    name: Telegram notify
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Telegram Notification
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN}}
          disable_web_page_preview: true
          message: |
            ✅ Deploy successful
            Repo: ${{ github.repository }}
            Branch: ${{ github.event.workflow_run.head_branch }}
            SHA: ${{ github.event.workflow_run.head_sha }}
            Commit: https://github.com/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}
            CI run: ${{ github.event.workflow_run.html_url }}
