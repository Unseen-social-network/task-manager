name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: task_manager_backend
  IMAGE_NAME_FRONTEND: task_manager_frontend

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/backend/Dockerfile
          push: true
          tags: |
            fgeeha/task_manager_backend:latest
            fgeeha/task_manager_backend:${{ github.event.workflow_run.head_sha }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            fgeeha/task_manager_frontend:latest
            fgeeha/task_manager_frontend:${{ github.event.workflow_run.head_sha }}

  trivy-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Install Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          version: latest

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: fgeeha/task_manager_backend:${{ github.event.workflow_run.head_sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: fgeeha/task_manager_frontend:${{ github.event.workflow_run.head_sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

  deploy:
    needs: trivy-scan
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Copy production compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          source: "docker-compose.production.yml,Makefile"
          target: "${{ secrets.PROJECT_PATH }}"
          overwrite: true

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          script: |
            cd /opt/planner
            docker compose -f docker-compose.production.yml pull
            docker compose -f docker-compose.production.yml up -d
            docker compose -f docker-compose.production.yml exec -T backend python manage.py migrate --no-input
            docker compose -f docker-compose.production.yml exec -T backend python manage.py collectstatic --no-input
            docker system prune -af

  send_message:
    name: Telegram notify
    needs: deploy
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Telegram Notification
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN}}
          message: |
            🚀 Deploy successful
            🔐 Trivy scan: PASSED
            Repo: ${{ github.repository }}
            Branch: ${{ github.event.workflow_run.head_branch }}
            SHA: ${{ github.event.workflow_run.head_sha }}
            Commit: https://github.com/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}
            CI run: ${{ github.event.workflow_run.html_url }}
