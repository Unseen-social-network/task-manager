name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  DOCKERHUB_NAMESPACE: fgeeha
  IMAGE_NAME_BACKEND: task_manager_backend
  IMAGE_NAME_FRONTEND: task_manager_frontend

jobs:
  build-backend:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          cache-from: type=registry,ref=${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME_BACKEND }}:buildx-cache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME_BACKEND }}:buildx-cache,mode=max
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME_BACKEND }}:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.event.workflow_run.head_sha }}

  build-frontend:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          cache-from: type=registry,ref=${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME_FRONTEND }}:buildx-cache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME_FRONTEND }}:buildx-cache,mode=max
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME_FRONTEND }}:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.event.workflow_run.head_sha }}

  trivy-backend:
    name: Trivy backend image scan
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.event.workflow_run.head_sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

  trivy-frontend:
    name: Trivy frontend image scan
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.event.workflow_run.head_sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

  deploy:
    needs: [trivy-backend, trivy-frontend]
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Copy production compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          source: "docker-compose.production.yml,Makefile,clickhouse-backups-allowed.xml"
          target: "${{ secrets.PROJECT_PATH }}"
          overwrite: true

      - name: Deploy to server
        env:
          DEPLOY_PATH: ${{ secrets.PROJECT_PATH }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            compose="docker compose -f docker-compose.production.yml"

            wait_for_health() {
              local container="$1"
              local retries="$2"
              local delay="$3"
              local status=""

              for _ in $(seq 1 "$retries"); do
                status="$(docker inspect -f '{{.State.Health.Status}}' "$container")"
                if [ "$status" = "healthy" ]; then
                  return 0
                fi
                sleep "$delay"
              done

              echo "Container $container health status: $status" >&2
              return 1
            }

            $compose pull
            DOCKER_BUILDKIT=1 $compose up -d --remove-orphans

            db_container="$($compose ps -q db)"
            if [ -z "$db_container" ]; then
              echo "Database container not found." >&2
              exit 1
            fi
            wait_for_health "$db_container" 24 5

            ch_container="$($compose ps -q clickhouse)"
            if [ -z "$ch_container" ]; then
              echo "ClickHouse container not found (check docker-compose.production.yml on server)." >&2
              exit 1
            fi
            wait_for_health "$ch_container" 36 5

            $compose exec -T backend python manage.py migrate --no-input
            $compose exec -T backend python manage.py collectstatic --no-input

            backend_container="$($compose ps -q backend)"
            if [ -z "$backend_container" ]; then
              echo "Backend container not found." >&2
              exit 1
            fi
            wait_for_health "$backend_container" 36 5

            frontend_container="$($compose ps -q frontend)"
            if [ -z "$frontend_container" ]; then
              echo "Frontend container not found." >&2
              exit 1
            fi
            wait_for_health "$frontend_container" 24 5

            docker image prune -f

  send_message:
    name: Telegram notify
    needs: deploy
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Telegram Notification
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Deploy successful
            🔐 Trivy scan: PASSED
            Repo: ${{ github.repository }}
            Branch: ${{ github.event.workflow_run.head_branch }}
            SHA: ${{ github.event.workflow_run.head_sha }}
            Commit: https://github.com/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}
            CI run: ${{ github.event.workflow_run.html_url }}
