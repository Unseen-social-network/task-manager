[tool.poetry]
name = "task-manager"
version = "0.1.1"
description = "Production-ready Django task planner with REST API"
authors = ["nkolesnikov <33605615+Fgeeha@users.noreply.github.com>"]
readme = "README.md"
package-mode = false

# =============================================================
# Dependencies
# =============================================================

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.0"
djangorestframework = "^3.14"
djangorestframework-simplejwt = "^5.3"
django-filter = "^24.0"
django-environ = "^0.11"
psycopg2-binary = "^2.9"
pillow = "^12.1.1"
drf-spectacular = "^0.27"
django-cors-headers = "^4.3"
gunicorn = "^23.0.0"
aiohttp = "^3.13.3"
openpyxl = "^3.1.5"
apscheduler = "^3.11.0"
clickhouse-connect = "^0.8"


[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-django = "^4.8"
pytest-cov = "^4.1"
ruff = "^0.9"
ipython = "^8.20"
factory-boy = "^3.3"
pre-commit = "^4.5.1"

# =============================================================
# Ruff — single source of truth
# =============================================================

[tool.ruff]
line-length = 88
target-version = "py312"
fix = true

# -------------------------------------------------------------
# Lint rules
# -------------------------------------------------------------
[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "B",
  "C4",
  "UP",
  "I",
  "C90",
]

ignore = [
  "E501",
  "B008",
  "B904",
  "Q000", # конфликтует с ruff-format
  "Q003", # конфликтует с ruff-format
]

# -------------------------------------------------------------
# Import sorting (ex-isort)
# -------------------------------------------------------------
[tool.ruff.lint.isort]
known-first-party = ["config", "planner", "telegram_bot", "users"]
combine-as-imports = true
force-sort-within-sections = true

# -------------------------------------------------------------
# Formatter (ex-Black)
# -------------------------------------------------------------
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

exclude = [
  "*/migrations/*.py",
]

# -------------------------------------------------------------
# Per-file ignores (ПРАВИЛЬНАЯ СЕКЦИЯ)
# -------------------------------------------------------------
[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501", "I001"]
"config/settings.py" = ["F401"]

# =============================================================
# Pytest
# =============================================================

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["backend"]
addopts = "--reuse-db --nomigrations"

# =============================================================
# Build system
# =============================================================

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
