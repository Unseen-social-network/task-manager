[tool.poetry]
name = "task-manager"
version = "0.1.0"
description = "Production-ready Django task planner with REST API"
authors = ["nkolesnikov <33605615+Fgeeha@users.noreply.github.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.0"
djangorestframework = "^3.14"
djangorestframework-simplejwt = "^5.3"
django-filter = "^24.0"
django-environ = "^0.11"
psycopg2-binary = "^2.9"
pillow = "^10.0"
gunicorn = "^21.2"
drf-spectacular = "^0.27"
django-cors-headers = "^4.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-django = "^4.8"
pytest-cov = "^4.1"
ruff = "^0.3"
ipython = "^8.20"
factory-boy = "^3.3"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise from
]

[tool.ruff.lint.isort]
known-first-party = ["config", "planner", "users"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["backend"]
addopts = "--reuse-db --nomigrations"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
