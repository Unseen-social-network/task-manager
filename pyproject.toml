[tool.poetry]
name = "planner"
version = "0.1.0"
description = "Planner backend"
authors = ["OpenAI Codex"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
Django = "^5.0.7"
djangorestframework = "^3.15.2"
djangorestframework-simplejwt = "^5.3.1"
drf-spectacular = "^0.27.2"
django-filter = "^24.2"
django-environ = "^0.11.2"
django-cors-headers = "^4.4.0"
psycopg = {version = "^3.1.19", extras = ["binary"]}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-django = "^4.8.0"
ruff = "^0.6.2"

[tool.ruff]
line-length = 100
extend-exclude = ["backend/planner/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
