server {
    listen 80;
    server_name _;

    add_header Server "" always;
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # --- Gzip ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml+rss
        text/javascript application/x-javascript
        image/svg+xml;

    # --- Security headers (умеренно безопасные, без фанатизма) ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ============================================================
    # API -> Django (важно: браузер ходит на /api/, nginx проксирует в backend)
    # ============================================================
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты под долгие ответы/загрузки
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Не кешируем ответы API
        add_header Cache-Control "no-store" always;
    }

    # Если админка нужна через тот же домен/порт
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================================
    # Static/Media (варианта два, см. примечание ниже)
    # ============================================================

    location ^~ /staticfiles/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location ^~ /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }



    # ============================================================
    # Frontend SPA
    # ============================================================

    # Кеш ассетов фронта
    #location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    #    expires 1y;
    #    add_header Cache-Control "public, immutable";
    #    try_files $uri =404;
    #    access_log off;
    #}

    # index.html не кешируем
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
