services:
  db:
    image: postgres:16-alpine3.20
    container_name: planner_db_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planner_db}
      POSTGRES_USER: ${POSTGRES_USER:-planner_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planner_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planner_user} -d ${POSTGRES_DB:-planner_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - planner_network

  clickhouse:
    image: clickhouse/clickhouse-server:24.10
    container_name: planner_clickhouse_prod
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-backups-allowed.xml:/etc/clickhouse-server/config.d/backups-allowed.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client -q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - planner_network

  backend:
    image: fgeeha/task_manager_backend:${IMAGE_TAG:-latest}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    env_file:
      - .env
    ports:
      - "8003:8000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-planner_user}:${POSTGRES_PASSWORD:-planner_pass}@db:5432/${POSTGRES_DB:-planner_db}
      - DEBUG=0
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/schema/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - planner_network

  backup-scheduler:
    image: fgeeha/task_manager_backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-planner_user}:${POSTGRES_PASSWORD:-planner_pass}@db:5432/${POSTGRES_DB:-planner_db}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "manage.py", "run_backup_scheduler"]
    networks:
      - planner_network

  nginx:
    image: fgeeha/task_manager_frontend:${IMAGE_TAG:-latest}
    ports:
      - "3003:80"
    volumes:
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - planner_network

volumes:
  postgres_data:
  clickhouse_data:
  media_data:
  static_data:

networks:
  planner_network:
    driver: bridge
